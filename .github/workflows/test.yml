name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where setup-python no longer ships
    # 3.9. Pinning 22.04 keeps the whole 3.9-3.13 matrix available.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q

  dogfood:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: preflight scans its own source
        run: python preflight.py scan . --min-severity low
